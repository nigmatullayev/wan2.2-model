name: Deploy to RunPod

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to RunPod
        uses: docker/login-action@v2
        with:
          registry: registry.runpod.io
          username: ${{ secrets.RUNPOD_USERNAME }}
          password: ${{ secrets.RUNPOD_API_KEY }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: registry.runpod.io/${{ secrets.RUNPOD_USERNAME }}/wan2.2-model:latest
          cache-from: type=registry,ref=registry.runpod.io/${{ secrets.RUNPOD_USERNAME }}/wan2.2-model:buildcache
          cache-to: type=registry,ref=registry.runpod.io/${{ secrets.RUNPOD_USERNAME }}/wan2.2-model:buildcache,mode=max

      - name: Deploy to RunPod
        run: |
          echo "✅ Docker image built and pushed successfully"
          echo "📝 Next steps:"
          echo "1. Go to RunPod Dashboard → Serverless → Templates"
          echo "2. Create new template or update existing one"
          echo "3. Use image: registry.runpod.io/${{ secrets.RUNPOD_USERNAME }}/wan2.2-model:latest"

