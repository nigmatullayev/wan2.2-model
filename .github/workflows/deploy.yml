name: Deploy to RunPod

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Install diagnostic tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y dnsutils curl || true

      - name: Check DNS and registry connectivity
        run: |
          echo "Checking DNS for registry.runpod.io..."
          nslookup registry.runpod.io || (echo "nslookup failed"; exit 1)
          echo "Checking HTTPS endpoint..."
          curl -sS --head https://registry.runpod.io/v2/ | head -n 5 || echo "curl failed (may be transient)"

      - name: Docker login to RunPod (with retries)
        env:
          RUNPOD_USER: ${{ secrets.RUNPOD_USERNAME }}
          RUNPOD_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          set -e
          if [ -z "$RUNPOD_USER" ] || [ -z "$RUNPOD_KEY" ]; then
            echo "ERROR: RUNPOD_USERNAME or RUNPOD_API_KEY secret is missing"; exit 1
          fi
          for i in 1 2 3 4 5; do
            echo "Attempt #$i: docker login registry.runpod.io"
            echo "$RUNPOD_KEY" | docker login registry.runpod.io -u "$RUNPOD_USER" --password-stdin && { echo "Login succeeded"; break; }
            echo "Login failed, sleep $((i*5))s and retry..."
            sleep $((i*5))
            if [ $i -eq 5 ]; then
              echo "ERROR: Docker login failed after retries"; exit 1
            fi
          done

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: registry.runpod.io/${{ secrets.RUNPOD_USERNAME }}/wan2.2-model:latest
          cache-from: type=registry,ref=registry.runpod.io/${{ secrets.RUNPOD_USERNAME }}/wan2.2-model:buildcache
          cache-to: type=registry,ref=registry.runpod.io/${{ secrets.RUNPOD_USERNAME }}/wan2.2-model:buildcache,mode=max

      - name: Deploy to RunPod
        run: |
          echo "✅ Docker image built and pushed successfully"
          echo "📝 Next steps:"
          echo "1. Go to RunPod Dashboard → Serverless → Templates"
          echo "2. Create new template or update existing one"
          echo "3. Use image: registry.runpod.io/${{ secrets.RUNPOD_USERNAME }}/wan2.2-model:latest"
